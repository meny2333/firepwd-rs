[package]
name = "firepwd-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite  = { version = "0.31", features = ["bundled"] }
des       = "0.8"
aes       = "0.8"
cbc       = { version = "0.1", features = ["alloc"] }
cipher    = "0.4"
sha1      = "0.10"
sha2      = "0.10"
hmac      = "0.12"
pbkdf2    = "0.12"
base64    = "0.22"
hex       = "0.4"
serde     = { version = "1.0", features = ["derive"] }
serde_json= "1.0"
clap      = { version = "4.0", features = ["derive"] }
num-bigint= "0.4"